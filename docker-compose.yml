services:
  review-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review
      POSTGRES_DB: review
      POSTGRES_PASSWORD: review-development-only
    volumes:
      - review-postgres-data:/var/lib/postgresql/data
      - review-backups:/backups
    networks:
      - review-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]
      interval: 5s
      timeout: 3s
      retries: 10

  review-api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://review:review-development-only@review-postgres:5432/review
      SESSION_COOKIE_NAME: review_session
      SESSION_HOURS: "12"
      SESSION_SECRET: development-session-secret-change-before-production
      CSRF_SECRET: development-csrf-secret-change-before-production
      RECEIPT_SECRET: development-receipt-secret-change-before-production
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      APP_ENV: development
      SECURE_COOKIE: "false"
    depends_on:
      review-postgres:
        condition: service_healthy
    networks:
      - review-internal
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)) == {'status':'ok'}"]
      interval: 10s
      timeout: 3s
      retries: 5

  review-web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  review-internal:
    internal: true

volumes:
  review-postgres-data:
  review-backups:
