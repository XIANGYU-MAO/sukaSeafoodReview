pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    client_max_body_size 20m;
    client_body_temp_path /tmp/client_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data: https://inaturalist.org https://*.inaturalist.org https://inaturalist-open-data.s3.amazonaws.com https://caos.boldsystems.org https://cdn.floridamuseum.ufl.edu https://collections.nmnh.si.edu https://huggingface.co https://pictures.snsb.info https://specify.saiab.ac.za https://www.morphosource.org https://wikimedia.org https://*.wikimedia.org https://wikimediausercontent.com https://*.wikimediausercontent.com https://gbif.org https://*.gbif.org https://fishair.org https://*.fishair.org https://fish-vista.org https://*.fish-vista.org https://fishvista.org https://*.fishvista.org https://example.test https://*.example.test https://e2e.test https://*.e2e.test" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "SukaSeafood review-web ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
